version: "2"

run:
  timeout: 5m

formatters:
  enable:
    - gofumpt
  settings:
    gofumpt:
      extra:
        group-params: true

linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose # HTTP body close
    - canonicalheader
    - containedctx
    - contextcheck
    - copyloopvar
    - decorder
    - dogsled
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - errcheck # Unchecked errors
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - fatcontext
    - forcetypeassert
    - gocheckcompilerdirectives
    - gocritic # Advanced checks
    - godot
    - godox
    - goprintffuncname
    - gosec # Security issues
    - govet # Built-in vet
    - grouper
    - iface
    - inamedparam
    - ineffassign
    - interfacebloat
    # intrange disabled: rewrites to range-over-int, which yaegi (Traefik's plugin
    # interpreter, see yaegi_test) cannot parse — breaks plugin loading.
    # - intrange
    - iotamixing
    - loggercheck
    - makezero
    - mirror
    - misspell # Typos in comments/strings
    - musttag
    - nakedret
    - nilerr
    - nilnesserr
    - nilnil
    - nlreturn
    - noctx
    - nolintlint # Enforce nolint comments
    - nonamedreturns
    - perfsprint
    - predeclared
    - protogetter
    - reassign
    - recvcheck
    - rowserrcheck
    - sloglint
    - sqlclosecheck
    - staticcheck # Go vet++
    - testableexamples
    - thelper
    - unconvert # Unnecessary conversions
    - unparam
    - unused
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
    - gochecksumtype
    - goconst
    - importas
    # modernize disabled: rewrites to newer stdlib/syntax (maps.Copy, range-over-int)
    # that yaegi (Traefik's plugin interpreter, see yaegi_test) cannot parse.
    # - modernize
    - nosprintfhostport
    - prealloc
    - tparallel

  settings:
    goconst:
      min-occurrences: 5
      ignore-tests: true
    errchkjson:
      # Only report json.Marshal calls that can genuinely fail (unsafe types).
      # Safe types like plain structs and map[string]string are ignored.
      check-error-free-encoding: false
    gocritic:
      disabled-checks:
        - ifElseChain
        - elseif
        - appendAssign
        - assignOp
        - unlambda
  exclusions:
    paths:
      - .claude
      - v1
    rules:
    - path: _test\.go
      linters:
        - errcheck
        - errchkjson
        - gosec
    - path: testutils/*.go
      linters:
        - errcheck
        - errchkjson
        - gosec

output:
  path-mode: "abs"
  formats:
    text:
      colors: true
      path: stdout
      print-issued-lines: true
      print-linter-name: true
  sort-order:
    - linter
    - file
    - severity

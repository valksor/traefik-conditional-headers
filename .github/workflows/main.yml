name: Main

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:

  main:
    name: Main Process
    runs-on: ubuntu-latest
    env:
      GO_VERSION: "1.26"
      GOLANGCI_LINT_VERSION: v2.12.2
      YAEGI_VERSION: v0.16.1
      CGO_ENABLED: 1

    steps:

      # https://github.com/marketplace/actions/setup-go-environment
      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # https://github.com/marketplace/actions/checkout
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Install from source via the Go module proxy (proxy.golang.org + sum.golang.org),
      # not curl|sh from golangci-lint's mutable master branch: that installer's checksum
      # parsing broke for v2.12.2 (compared the tarball against the .sbom.json hash).
      # CGO_ENABLED=0: neither tool needs cgo; avoids requiring a C toolchain to compile them.
      - name: Install golangci-lint ${{ env.GOLANGCI_LINT_VERSION }}
        run: |
          CGO_ENABLED=1 go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"
          golangci-lint version

      - name: Install Yaegi ${{ env.YAEGI_VERSION }}
        run: CGO_ENABLED=1 go install "github.com/traefik/yaegi/cmd/yaegi@${YAEGI_VERSION}"

      - name: Install quality tooling
        run: |
          command -v bash >/dev/null || { echo "bash is required for the import-alias check"; exit 1; }
          sudo apt-get update && sudo apt-get install -y gawk
          go install golang.org/x/tools/cmd/goimports@v0.47.0
          go install mvdan.cc/gofumpt@v0.10.0

      - name: Check and get dependencies
        run: |
          go mod tidy
          git diff --exit-code go.mod
          # git diff --exit-code go.sum
          go mod download
          go mod vendor
          # git diff --exit-code ./vendor/

      - name: Lint and Tests
        run: make

      # Fail if `make` (gofumpt/goimports/golangci-lint --fix) rewrote any committed source.
      - name: Ensure quality made no changes
        run: git diff --exit-code

      - name: Install goveralls
        run: go install github.com/mattn/goveralls@latest
      - name: Send coverage
        env:
          COVERALLS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: goveralls -coverprofile=covprofile -service=github

      - name: Run tests with Yaegi
        run: make yaegi_test
        env:
          GOPATH: ${{ github.workspace }}/go
